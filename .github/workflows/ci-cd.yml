name: CI/CD - System Metrics Agent

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Moindre privilège par défaut ; chaque job élargit si besoin
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # Job 1 : tests, couverture, analyse SonarQube et Quality Gate
  # ---------------------------------------------------------------
  test:
    name: Tests + SonarQube
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (historique complet pour SonarQube)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (black + flake8)
        run: |
          black --check app
          flake8 app

      - name: Tests avec couverture
        run: pytest --cov=app --cov-report=xml --cov-report=term

      - name: Analyse SonarQube
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Quality Gate (échec si la porte qualité n'est pas validée)
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # ---------------------------------------------------------------
  # Job 2 : build, scan Trivy, push Docker Hub (api et agent)
  # ---------------------------------------------------------------
  build-scan-push:
    name: Build, scan et push (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      security-events: write # upload du rapport SARIF (onglet Security)
    strategy:
      fail-fast: false
      matrix:
        service: [api, agent]
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/system-metrics-${{ matrix.service }}
      # Push seulement sur un push vers main (jamais sur une pull request)
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Connexion à Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurer Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build de l'image (sans push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.${{ matrix.service }}
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Taille de l'image
        run: docker image ls "${IMAGE}"

      # Action épinglée par SHA de commit (protège contre un tag déplacé)
      - name: Rapport Trivy SARIF (informatif)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Publier le SARIF dans l'onglet Security
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.service)) != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

      - name: Scan Trivy bloquant (HIGH/CRITICAL corrigeables)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: "1"
          skip-setup-trivy: true

      - name: Push sur Docker Hub (main uniquement, scan réussi)
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.${{ matrix.service }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
