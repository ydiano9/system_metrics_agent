# Lancement local : docker compose up --build
# Avec le monitoring : voir docker-compose.monitoring.yml

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: system-metrics-api:local
    ports:
      - "8000:8000"
    env_file: .env
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)"
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    image: system-metrics-agent:local
    env_file: .env
    environment:
      # Nom de service Docker, résolu par le DNS interne du réseau Compose
      METRICS_ENDPOINT: http://api:8000/metrics
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
