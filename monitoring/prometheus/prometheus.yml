global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Métriques de l'API + métriques système relayées depuis les agents
  - job_name: system-metrics-api
    metrics_path: /prometheus
    static_configs:
      - targets: ["api:8000"]

  # Prometheus se surveille lui-même
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
